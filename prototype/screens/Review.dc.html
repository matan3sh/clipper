<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clippr — Add voucher, details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&amp;family=Caveat:wght@600&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
input{outline:none}input:focus{border-color:#17132e}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #ffffff; color: #1b1830; font-family: 'Inter', system-ui, sans-serif; font-feature-settings: 'ss01'; letter-spacing: -0.02em; -webkit-font-smoothing: antialiased">
  <div style="padding: 58px 20px 0; display: flex; flex-direction: column; gap: 16px">

    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Analyze.dc.html" aria-label="Back to analysis" style="width: 44px; height: 44px; border-radius: 888px; background: #f8f7fd; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1b1830" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      </a>
      <span style="font-size: 16px; font-weight: 600">Add voucher</span>
      <span style="width: 44px"></span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <div style="display: flex; flex-direction: column; gap: 6px"><span style="height: 4px; border-radius: 100px; background: #17132e"></span><span style="font-size: 11px; font-weight: 500; color: #625e78">1 Capture</span></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><span style="height: 4px; border-radius: 100px; background: #17132e"></span><span style="font-size: 11px; font-weight: 500; color: #625e78">2 Analyze</span></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><span style="height: 4px; border-radius: 100px; background: #17132e"></span><span style="font-size: 11px; font-weight: 600">3 Details</span></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><span style="height: 4px; border-radius: 100px; background: #e7e5f1"></span><span style="font-size: 11px; font-weight: 500; color: #625e78">4 Reminders</span></div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 16px; background: #f8f7fd">
      <div aria-hidden="true" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 10px; background: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: rgba(23, 19, 46, 0.06) 0px 1px 2px 0px">
        <div style="width: 26px; height: 34px; border-radius: 4px; transform: rotate(-5deg); box-shadow: inset 0 0 0 1px #e7e5f1; display: flex; flex-direction: column; gap: 3px; padding: 5px; box-sizing: border-box">
          <span style="height: 3px; width: 12px; background: #1b1830; border-radius: 2px"></span>
          <span style="height: 5px; width: 14px; background: #d3d0e3; border-radius: 2px"></span>
        </div>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px">
        <span style="font-size: 14px; font-weight: 600">Quality 86 · 3 fields filled</span>
        <span style="font-size: 13px; font-weight: 500; color: #625e78">Check them and pick a category</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="store" style="font-size: 13px; font-weight: 500; color: #625e78">Store name</label>
      <div style="position: relative">
        <input id="store" value="Northwind Books" style="width: 100%; height: 50px; box-sizing: border-box; padding: 0 110px 0 14px; border: 1px solid #d3d0e3; border-radius: 16px; font: inherit; font-size: 16px; font-weight: 500; color: #1b1830">
        <span style="position: absolute; right: 10px; top: 13px; height: 24px; padding: 0 8px; border-radius: 100px; background: #e1e0fc; color: #3d2fb0; font-size: 11px; font-weight: 600; display: flex; align-items: center">From photo</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="amount" style="font-size: 13px; font-weight: 500; color: #625e78">Amount</label>
      <div style="display: flex; gap: 8px">
        <input id="amount" value="40.00" inputmode="decimal" style="flex-grow: 1; min-width: 0; height: 50px; box-sizing: border-box; padding: 0 14px; border: 1px solid #d3d0e3; border-radius: 16px; font: inherit; font-size: 16px; font-weight: 600; color: #1b1830">
        <button aria-label="Currency, US dollar" style="height: 50px; padding: 0 12px 0 14px; border: 1px solid #d3d0e3; border-radius: 16px; background: #ffffff; font: inherit; font-size: 15px; font-weight: 600; color: #1b1830; display: flex; align-items: center; gap: 6px">
          $ USD
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#625e78" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
        </button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="expiry" style="font-size: 13px; font-weight: 500; color: #625e78">Expiry date</label>
      <button id="expiry" style="height: 50px; padding: 0 14px; border: 1px solid #d3d0e3; border-radius: 16px; background: #ffffff; font: inherit; color: #1b1830; display: flex; align-items: center; gap: 10px; text-align: left">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1b1830" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
        <span style="flex-grow: 1; font-size: 16px; font-weight: 500">Sat, 17 Oct 2026</span>
        <span style="font-size: 13px; font-weight: 600; color: #3d2fb0">in 6 days</span>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 500; color: #625e78">Category</span>
      <div role="radiogroup" aria-label="Category" style="display: flex; gap: 8px; flex-wrap: wrap">
        <button role="radio" aria-checked="true" style="height: 36px; padding: 0 14px; border: 1px solid #17132e; border-radius: 100px; background: #17132e; color: #ffffff; font: inherit; font-size: 14px; font-weight: 500">Books</button>
        <button role="radio" aria-checked="false" style="height: 36px; padding: 0 14px; border: 1px solid #d3d0e3; border-radius: 100px; background: #ffffff; color: #1b1830; font: inherit; font-size: 14px; font-weight: 500">Fashion</button>
        <button role="radio" aria-checked="false" style="height: 36px; padding: 0 14px; border: 1px solid #d3d0e3; border-radius: 100px; background: #ffffff; color: #1b1830; font: inherit; font-size: 14px; font-weight: 500">Home</button>
        <button role="radio" aria-checked="false" style="height: 36px; padding: 0 14px; border: 1px solid #d3d0e3; border-radius: 100px; background: #ffffff; color: #1b1830; font: inherit; font-size: 14px; font-weight: 500">Beauty</button>
        <button role="radio" aria-checked="false" style="height: 36px; padding: 0 14px; border: 1px solid #d3d0e3; border-radius: 100px; background: #ffffff; color: #1b1830; font: inherit; font-size: 14px; font-weight: 500">Food</button>
        <button role="radio" aria-checked="false" style="height: 36px; padding: 0 14px; border: 1px solid #d3d0e3; border-radius: 100px; background: #ffffff; color: #1b1830; font: inherit; font-size: 14px; font-weight: 500">Tech</button>
        <button role="radio" aria-checked="false" style="height: 36px; padding: 0 14px; border: 1px solid #d3d0e3; border-radius: 100px; background: #ffffff; color: #1b1830; font: inherit; font-size: 14px; font-weight: 500">Other</button>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px">
    <a href="SetReminders.dc.html" style="height: 56px; border-radius: 100px; background: #17132e; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; box-shadow: rgb(35, 30, 64) 0px 0px 0px 1px, rgba(23, 19, 46, 0.48) 0px 1px 2px 0px">Continue</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
