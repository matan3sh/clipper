<!doctype html>
<html lang="en">
<head>

</head>

<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&amp;family=Caveat:wght@600&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:#17132e}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #ffffff; color: #1b1830; font-family: 'Inter', system-ui, sans-serif; font-feature-settings: 'ss01'; letter-spacing: -0.02em; -webkit-font-smoothing: antialiased">
  <div style="padding: 62px 20px 0; display: flex; flex-direction: column; gap: 24px">

    <h1 style="margin: 0; font-size: 32px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.25">Settings</h1>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h2 style="margin: 0; font-size: 16px; font-weight: 600">Default reminders</h2>
        <span style="font-size: 13px; font-weight: 500; color: #625e78">Pre-selected for every new voucher</span>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <button aria-pressed="true" style="height: 36px; padding: 0 12px 0 10px; border: 1px solid #17132e; border-radius: 100px; background: #17132e; color: #ffffff; font: inherit; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17 19 7"></path></svg>7d</button>
        <button aria-pressed="true" style="height: 36px; padding: 0 12px 0 10px; border: 1px solid #17132e; border-radius: 100px; background: #17132e; color: #ffffff; font: inherit; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17 19 7"></path></svg>3d</button>
        <button aria-pressed="true" style="height: 36px; padding: 0 12px 0 10px; border: 1px solid #17132e; border-radius: 100px; background: #17132e; color: #ffffff; font: inherit; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17 19 7"></path></svg>1d</button>
        <button aria-pressed="false" style="height: 36px; padding: 0 14px; border: 1px solid #d3d0e3; border-radius: 100px; background: #ffffff; color: #1b1830; font: inherit; font-size: 14px; font-weight: 500">On the day</button>
      </div>
      <div style="display: flex; flex-direction: column; margin-top: 4px">
        <button style="height: 52px; border: 0; border-top: 1px solid #e7e5f1; border-bottom: 1px solid #e7e5f1; background: none; padding: 0; font: inherit; color: #1b1830; display: flex; align-items: center; justify-content: space-between">
          <span style="font-size: 15px; font-weight: 500">Notify at</span>
          <span style="font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px">9:00 AM<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#625e78" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></span>
        </button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h2 style="margin: 0; font-size: 16px; font-weight: 600">Currency</h2>
        <span style="font-size: 13px; font-weight: 500; color: #625e78">Used for new vouchers and your total</span>
      </div>
      <div role="radiogroup" aria-label="Currency" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <button role="radio" aria-checked="true" style="height: 56px; border: 1px solid #17132e; border-radius: 16px; background: #17132e; color: #ffffff; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px"><span style="font-size: 16px; font-weight: 600">$</span><span style="font-size: 11px; font-weight: 600; opacity: 0.8">USD</span></button>
        <button role="radio" aria-checked="false" style="height: 56px; border: 1px solid #d3d0e3; border-radius: 16px; background: #ffffff; color: #1b1830; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px"><span style="font-size: 16px; font-weight: 600">€</span><span style="font-size: 11px; font-weight: 600; color: #625e78">EUR</span></button>
        <button role="radio" aria-checked="false" style="height: 56px; border: 1px solid #d3d0e3; border-radius: 16px; background: #ffffff; color: #1b1830; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px"><span style="font-size: 16px; font-weight: 600">£</span><span style="font-size: 11px; font-weight: 600; color: #625e78">GBP</span></button>
        <button role="radio" aria-checked="false" style="height: 56px; border: 1px solid #d3d0e3; border-radius: 16px; background: #ffffff; color: #1b1830; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px"><span style="font-size: 16px; font-weight: 600">₪</span><span style="font-size: 11px; font-weight: 600; color: #625e78">ILS</span></button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column">
      <h2 style="margin: 0 0 4px; font-size: 16px; font-weight: 600">On this phone</h2>
      <div style="height: 52px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e7e5f1">
        <span style="font-size: 15px; font-weight: 500">Notifications</span>
        <span style="font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 888px; background: #6c56fc"></span>Allowed</span>
      </div>
      <div style="height: 52px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e7e5f1">
        <span style="font-size: 15px; font-weight: 500">Stored vouchers</span>
        <span style="font-size: 15px; font-weight: 600">9 · 2.4 MB</span>
      </div>
      <button style="height: 52px; border: 0; background: none; padding: 0; font: inherit; font-size: 15px; font-weight: 600; color: #1b1830; text-align: left">Delete all vouchers</button>
      <p style="margin: 4px 0 0; font-size: 13px; font-weight: 500; line-height: 1.45; color: #625e78">No account, no cloud. Photos and details never leave this device.</p>
    </section>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 20px; right: 20px; bottom: 30px; display: flex; align-items: center; gap: 12px">
    <div style="flex-grow: 1; height: 60px; padding: 6px; box-sizing: border-box; border-radius: 100px; background: #ffffff; box-shadow: rgba(0, 0, 0, 0.05) 0px 1.78px 8px 0px, rgba(0, 0, 0, 0.04) 0px 0.89px 2.67px 0px, rgba(23, 19, 46, 0.06) 0px 0px 0px 1px; display: flex; gap: 4px">
      <a href="Main.dc.html" style="flex: 1; border-radius: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 500; color: #625e78">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#625e78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"></rect><path d="M3 10h18"></path><path d="M7 3h10"></path></svg>
        Home
      </a>
      <a href="Reminders.dc.html" style="flex: 1; border-radius: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 500; color: #625e78">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#625e78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
        Alerts
      </a>
      <a href="Settings.dc.html" aria-current="page" style="flex: 1; border-radius: 100px; background: #f8f7fd; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: #1b1830">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1b1830" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg>
        Settings
      </a>
    </div>
    <a href="Scan.dc.html" aria-label="Add a voucher" style="width: 60px; height: 60px; flex-shrink: 0; border-radius: 888px; background: #17132e; display: flex; align-items: center; justify-content: center; box-shadow: rgb(35, 30, 64) 0px 0px 0px 1px, rgba(23, 19, 46, 0.48) 0px 1px 2px 0px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
  </nav>
</div>
</x-dc>
